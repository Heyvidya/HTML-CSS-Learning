<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube.com Clone</title>

    <style>
        .photo1{
            width:400px;


        }

        .Searchbox{
            width: 140px;
            padding-bottom: 9px;
            padding-top: 9px;
            font-size: medium;
            display:block;
            margin-bottom:2px;
            

            

        }
        .video-title{
            font-weight: bold;
            font-size:18px;
            width:300px;
            margin-top: 4px;
            margin-bottom:0px;
        }

        .channel{
            color: rgb(70, 70, 70);
            margin-top:9px;
            margin-bottom:0px;
        }

        .time{
            color: rgb(70, 70, 70);
            margin-top:6px;

        }

        .video-preview{
            margin-left:5px;
            margin-top: 5px;
            width:400px;
            display:inline-block;
            
        }

        

        .photo2{
            width:400px;
            
        }


        .video-title1{
            font-weight: bold;
            font-size:18px;
            width:300px;
            margin-top: 4px;
            margin-bottom:0px;
        }

        .channel1{
             color: rgb(70, 70, 70);
            margin-top:9px;
            margin-bottom:0px;
        }

        .time1{
             color: rgb(70, 70, 70);
            margin-top:6px;
        }

        .video-preview2{
            margin-left:5px;
            margin-top: 5px;
            width:400px;
            display:inline-block;
            vertical-align: top;
        }




    </style>
</head>
<body>
    
    <input class="Searchbox" type="text" placeholder="Search">
    <div class="video-preview">
        <img class="photo1" src="photos/photo 1.webp"  alt="photo1">
        <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
        <p class="channel">Marques Brownie</p>
        <p class="time">3.4M views . 6 months ago</p>
    </div>

    <div class="video-preview2">
        <img class="photo2" src="photos/photo 2.webp"  alt="photo1">
        <p class="video-title1">Try Not To Laugh Challenge #9</p>
        <p class="channel1">Markiplier</p>
        <p class="time1">19M views . 4 years ago</p>

    </div>
    
</body>
</html>
