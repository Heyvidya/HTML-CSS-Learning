<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .square{
            width:100px;
            height: 100px;
            background-color:red;
            display:inline-block;
        }

        .circle{
            width:100px;
            height:100px;
            display:inline-block;
            background-color: green;
            border-radius:360px;

        }

        .survey{
            width:300px;
            border-width:1px;
            border-style: solid;
            padding-left:6px;
            padding-bottom:15px;
            font-family:Arial;
            border-color: rgb(150,150,150);
            margin-bottom: 5px;
            
        
        }

        .youtube{
             width:370px;
            border-width:1px;
            border-style: solid;
            padding-left:6px;
            padding-bottom:15px;
            font-family:Arial;
            border-color: rgb(150,150,150);
            background-color: rgb(34, 34, 34);
            color: white;
            
        }

        .youtubemusic{
            font-weight: bold;
            font-size:20px;
        }
    </style>
</head>
<body>
    <div class="square"></div>
    <div class="circle"></div>
    <div class="survey">
    <p>Satisified with our service?</p>
    <button>Yes</button>
    <button>No</button>
    </div>

    <div class="youtube">
        <p class="youtubemusic">Install YouTube Music</p>
        <p>Add Youtube Music to your desktop for quick and easy access</p>

    </div>
   

    
</body>
</html>
