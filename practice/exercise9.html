<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 9</title>
    <style>
        .final{
            display: grid;
            grid-template-columns:  200px 75px;

        }

        .first-column{
            background-color:rgb(188, 224, 246);
        }

        .second-column{
            background-color: lightpink;
        }

        .third-column{
            background-color:rgb(188, 224, 246);

        }

        .final3{
            display: grid;
            grid-template-columns:  50px 1fr 75px;
            margin-top: 15px;
            margin-bottom: 15px;

        }

        .columns{
            display: grid;
            grid-template-columns:  1fr 1fr 1fr 1fr;
            column-gap: 20px;
            row-gap: 10px;
            

        }

    </style>

</head>
<body>
    
    <div class="final">
        <div class="first-column">200px</div>
        <div class="second-column">75px</div>

    </div>


    <div class="final3">
        <div class="first-column">col1</div>
        <div class="second-column">col2</div>
        <div class="third-column">col3</div>

    </div>

    <div class="columns">
        
        <div class="second-column">col1</div>
        <div class="second-column">col2</div>
        <div class="second-column">col3</div>
        <div class="second-column">col4</div>
        <div class="second-column">col1</div>
        <div class="second-column">col2</div>
        <div class="second-column">col3</div>
        <div class="second-column">col4</div>

    </div>

  
        


    

</body>
</html>
