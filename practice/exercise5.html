<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise5</title>
    <style>
        .gojo{
            width:200px;
            margin-left: 20px;
            margin-top: 20px;
            border-radius:7px;
            margin-right: 20px;
        }

        .gojo1{
            width:150px;
            height:150px;
            object-fit:cover;
            
        }

        .gojo2{
            width:150px;
            height:150px;
            object-fit:cover;
            border-radius:360px;
        }

        .Searchbox{
            width: 150px;
            padding-bottom: 9px;
            padding-top: 9px;
            font-size: medium;
            border-radius:5px;
            border-style: solid;
            border-width:1px;

        }

        .google{
            width:400px;
            padding-bottom:9px ;
            padding-top:9px;
            font-size:13px;
            border-radius: 15px;
            border-style:solid;
            border-width: 1px;
            padding-left:10px;
            border:none;
            box-shadow: 4px 4px 10px rgba(0 ,0,0,0.15);
            
        }

        p{
            color:rgb(103, 103, 103);
            margin-bottom: 3px;
            font-family:Arial;
        }

        .linkedin{
            margin-top:3px;
            width:400px;
            padding-bottom:7px ;
            padding-top:7px;
            border-style: solid;
            border-radius:7px;
            

        }

        button{
            margin-top:15px;
            margin-left: 70px;
            padding-bottom:12px;
            padding-top: 12px;
            width:300px;
            background-color: rgb(39, 115, 202);
            font-size: 17px;
            color: white;
            border:none;
            border-radius:25px;
            margin-bottom:30px;
        }

        .gojo3{
            width:70px;
            height:70px;
            object-fit:cover;
            border-radius:360px;
            margin-top: 25px;
            vertical-align: middle;
            margin-left: 20px;
        }

        .search{
            width:300px;
            border:none;
            padding-bottom:9px ;
            padding-top:15px;
            font-size: medium;
            vertical-align: middle;

           

        }




    </style>
</head>
<body>
    
    <img class="gojo" src="../photos/gojo.jpg" alt="gojo">
    <img class="gojo1" src="../photos/gojo.jpg" alt="gojo">
    <img class="gojo2" src="../photos/gojo.jpg" alt="gojo">
    <input class="Searchbox" type="text" placeholder="Search">
    <input class="google" type="text" placeholder="Search Google or type a URL">
    <p>Email</p>
    <input class="linkedin" type="email">
    <p>By clicking Agree & Join, you agree to the Privacy Policy</p>
    <button>Agree & Join</button><br>
    <img class="gojo3" src="../photos/gojo.jpg" alt="gojo">
    <input class="search"  type="text" placeholder="What's happening ?">


    
</body>
    
</body>
</html>
